spring.application.name=SpringAI
spring.ai.chat.client.enabled=false
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=0.1
spring.ai.ollama.chat.model=llama3.1
spring.ai.ollama.chat.options.temperature=0.1
spring.ai.ollama.embedding.enabled=true
spring.ai.ollama.embedding.model=mxbai-embed-large
weather.api-key=${WEATHER_API_KEY}
weather.api-url=https://api.weatherapi.com/v1

management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true

#Metrics Configuration - Essential settings for good data collection
management.metrics.distribution.percentiles-histogram.all=true
management.metrics.enable.all=true
#Prometheus Configuration
management.prometheus.metrics.export.step=5s
#Micrometer Tracing for examplars
management.tracing.sampling.probability=1.0
management.tracing.enabled=true